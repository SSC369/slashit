# Tool configuration only. This is not a build target and the backend is not
# packaged; it is deployed as a container. Dependencies live in requirements.txt.

[tool.ruff]
line-length = 88
target-version = "py312"
# Never lint what pip installed, and never reformat documentation.
# `ruff format .` rewrites Python code blocks inside Markdown, which
# silently edited backend/rules/repo-rules.md once.
extend-exclude = [".venv", "venv", "env", "*.md", "rules"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN"]
# ANN401 forbids typing.Any itself. Kept out: a handful of framework boundaries
# (a structlog processor, a Strawberry permission hook, the error-mapping
# decorator) are typed Any because the framework they satisfy is. ANN still
# requires a hint be present; this only stops it from rejecting Any as the hint.
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "live: calls the real model provider and spends money. Locally only, per 04.3 Q4",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[[tool.mypy.overrides]]
# asyncpg ships no type information; only live_signal.py imports it.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
