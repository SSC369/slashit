#import "./TaskFields.graphql"
#import "./ReminderFields.graphql"
#import "./MemoryFields.graphql"
#import "./EventFields.graphql"

fragment SearchResultsFields on SearchResults {
  query
  meaningUnavailable
  noSupport
  answerUnavailable
  answerLimitReached
  answer {
    sentences {
      text
      citations
    }
  }
  groups {
    recordType
    total
    hits {
      citation
      record {
        __typename
        ... on Task {
          ...TaskFields
        }
        ... on Reminder {
          ...ReminderFields
        }
        ... on Memory {
          ...MemoryFields
        }
        ... on Event {
          ...EventFields
        }
        # Display fields only, none of which clash with Memory's (006 4.3).
        ... on Expense {
          id
          amountPaise
          description
          spentOn
        }
      }
    }
  }
}
