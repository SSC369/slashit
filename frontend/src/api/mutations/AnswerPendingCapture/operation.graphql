#import "../../../fragments/SearchResultsFields.graphql"
#import "../../../fragments/TaskFields.graphql"
#import "../../../fragments/ReminderFields.graphql"
#import "../../../fragments/MemoryFields.graphql"
#import "../../../fragments/EventFields.graphql"

mutation AnswerPendingCapture($pendingCaptureId: ID!, $answer: String!) {
  answerPendingCapture(pendingCaptureId: $pendingCaptureId, answer: $answer) {
    __typename
    ... on TaskCreated {
      task {
        ...TaskFields
      }
    }
    ... on TasksListed {
      tasks {
        ...TaskFields
      }
    }
    ... on ReminderCreated {
      reminder {
        ...ReminderFields
      }
    }
    ... on RemindersListed {
      reminders {
        ...ReminderFields
      }
    }
    ... on ReminderLimitReached {
      message
      limit
    }
    ... on EventCreated {
      event {
        ...EventFields
      }
    }
    ... on EventsListed {
      events {
        ...EventFields
      }
    }
    ... on EventLimitReached {
      message
      limit
    }
    ... on EventAlertChoiceAsked {
      pendingCaptureId
      question
      choices {
        leadMinutes
        label
      }
    }
    ... on MemorySaved {
      memory {
        ...MemoryFields
      }
      secretCaution
    }
    ... on MemoriesListed {
      memories {
        ...MemoryFields
      }
      searchText
    }
    ... on MemoryTooLong {
      message
      length
      limit
    }
    ... on MemoryConflictAsked {
      pendingCaptureId
      question
      newText
      category
      conflicting {
        ...MemoryFields
      }
    }
    ... on SearchResults {
      ...SearchResultsFields
    }
    ... on SearchTooLong {
      length
      limit
    }
    ... on PendingQuestionCreated {
      pendingCaptureId
      question
    }
    ... on NonCommandGuidance {
      originalInput
    }
    ... on UnrecognisedCommand {
      attemptedName
      closestMatches
    }
    ... on UserLimitReached {
      message
      limit
      resetsAt
    }
    ... on ProviderUnavailable {
      message
    }
    ... on ProviderTimeout {
      message
      budgetSeconds
    }
    ... on SharedQuotaExhausted {
      message
    }
    ... on MalformedResult {
      message
      reason
    }
  }
}
