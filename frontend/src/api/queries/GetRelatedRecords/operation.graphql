#import "../../../fragments/ExpenseRecordFields.graphql"
#import "../../../fragments/TaskFields.graphql"
#import "../../../fragments/ReminderFields.graphql"
#import "../../../fragments/MemoryFields.graphql"
#import "../../../fragments/EventFields.graphql"

query GetRelatedRecords($recordType: RecordType!, $id: ID!) {
  relatedRecords(recordType: $recordType, id: $id) {
    __typename
    ... on Task {
      ...TaskFields
    }
    ... on Reminder {
      ...ReminderFields
    }
    ... on Memory {
      ...MemoryFields
    }
    ... on Event {
      ...EventFields
    }
    ... on Expense {
      ...ExpenseRecordFields
    }
  }
}
