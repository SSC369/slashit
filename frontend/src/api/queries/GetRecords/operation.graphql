#import "../../../fragments/TaskFields.graphql"
#import "../../../fragments/ReminderFields.graphql"
#import "../../../fragments/MemoryFields.graphql"
#import "../../../fragments/EventFields.graphql"

query GetRecords($filter: RecordsFilterInput) {
  records(filter: $filter) {
    __typename
    ... on Task {
      ...TaskFields
    }
    ... on Reminder {
      ...ReminderFields
    }
    ... on Memory {
      ...MemoryFields
    }
    ... on Event {
      ...EventFields
    }
    # Not ExpenseFields: Memory's `category` and nullable `originalInput`
    # share this selection set, so the clashing fields are aliased here and
    # renamed back in the response handler.
    ... on Expense {
      id
      amountPaise
      description
      expenseCategory: category
      spentOn
      origin
      expenseOriginalInput: originalInput
      createdAt
      updatedAt
    }
  }
}
