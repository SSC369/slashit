#import "../../../fragments/TaskFields.graphql"
#import "../../../fragments/ReminderFields.graphql"
#import "../../../fragments/MemoryFields.graphql"
#import "../../../fragments/EventFields.graphql"

query GetRecords($filter: RecordsFilterInput) {
  records(filter: $filter) {
    __typename
    ... on Task {
      ...TaskFields
    }
    ... on Reminder {
      ...ReminderFields
    }
    ... on Memory {
      ...MemoryFields
    }
    ... on Event {
      ...EventFields
    }
  }
}
