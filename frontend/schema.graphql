type AccountLocked {
  message: String!
  retryAfter: DateTime
}

type AccountNotVerified {
  message: String!
}

type AuthProviderUnavailable {
  message: String!
}

type CaptureHistoryPage {
  items: [CaptureTurn!]!
  nextCursor: String
}

union CaptureResult = TaskCreated | TasksListed | ReminderCreated | RemindersListed | ReminderLimitReached | MemorySaved | MemoriesListed | MemoryTooLong | PendingQuestionCreated | NonCommandGuidance | UnrecognisedCommand | UserLimitReached | ProviderUnavailable | ProviderTimeout | SharedQuotaExhausted | MalformedResult

type CaptureTurn {
  id: ID!
  inputText: String!
  outcome: CaptureTurnOutcome!
  resultingTaskId: ID
  resultingPendingCaptureId: ID
  resultingReminderId: ID
  resultingMemoryId: ID
  questionText: String
  answerText: String
  createdAt: DateTime!
}

enum CaptureTurnOutcome {
  TASK_CREATED
  QUESTION_ASKED
  DISCARDED
  REFUSED
  REMINDER_CREATED
  MEMORY_SAVED
  MEMORY_LISTED
}

"""Date (isoformat)"""
scalar Date

"""Date with time (isoformat)"""
scalar DateTime

union DeleteReminderResult = ReminderDeleteSucceeded | ReminderNotFound

type InvalidCredentials {
  message: String!
}

type InvalidMemory {
  message: String!
}

type InvalidReminder {
  message: String!
  field: String!
}

type InvalidReminderSettings {
  message: String!
  field: String!
}

type InvalidTimezone {
  message: String!
}

type MalformedResult {
  message: String!
  reason: String!
}

type MarkAllNotificationsReadSucceeded {
  markedCount: Int!
}

union MarkNotificationReadResult = Notification | NotificationNotFound

type Me {
  id: ID!
  email: String!
  username: String
  avatarUrl: String
}

input MemoriesFilterInput {
  category: MemoryCategory = null
  uncategorised: Boolean! = false
  search: String = null
}

type MemoriesListed {
  memories: [Memory!]!
  searchText: String
}

type Memory {
  id: ID!
  text: String!
  category: MemoryCategory
  origin: String!
  originalInput: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum MemoryCategory {
  PERSONAL
  PEOPLE
  PROFESSIONAL
  LIFE
}

type MemoryNotFound {
  message: String!
}

union MemoryResult = Memory | MemoryNotFound

type MemorySaved {
  memory: Memory!
  secretCaution: SecretKind
}

type MemoryTooLong {
  message: String!
  length: Int!
  limit: Int!
}

type Mutation {
  submitCapture(rawInput: String!): CaptureResult!
  answerPendingCapture(pendingCaptureId: ID!, answer: String!): CaptureResult!
  discardPendingCapture(pendingCaptureId: ID!): Boolean!
  updateTask(id: ID!, input: UpdateTaskInput!): UpdateTaskResult!
  completeTask(id: ID!): UpdateTaskResult!
  deleteTask(ids: [ID!]!): Int!
  recordsViewOpened: Boolean!
  updateTimezone(input: UpdateTimezoneInput!): UpdateTimezoneResult!
  updateReminderSettings(input: UpdateReminderSettingsInput!): UpdateReminderSettingsResult!
  signIn(input: SignInInput!): SignInResult!
  updateReminder(id: ID!, input: UpdateReminderInput!): UpdateReminderResult!
  deleteReminder(id: ID!): DeleteReminderResult!
  markReminderDone(id: ID!): ReminderActionResult!
  snoozeReminder(id: ID!, option: SnoozeChoice!): ReminderActionResult!
  markNotificationRead(id: ID!): MarkNotificationReadResult!
  markAllNotificationsRead: MarkAllNotificationsReadSucceeded!
  updateMemory(id: ID!, input: UpdateMemoryInput!): UpdateMemoryResult!
}

type NoFieldsToUpdate {
  message: String!
}

type NonCommandGuidance {
  originalInput: String!
}

type Notification {
  id: ID!
  kind: NotificationKind!
  targetId: ID
  title: String!
  detail: String!
  marker: NotificationMarker!
  occurredAt: DateTime!
  createdAt: DateTime!
  read: Boolean!
  action: NotificationAction
  actedAt: DateTime
  showPopup: Boolean!
}

enum NotificationAction {
  DONE
  SNOOZED
}

enum NotificationKind {
  REMINDER
  EMAIL_PAUSED
}

enum NotificationMarker {
  NONE
  LATE
  MISSED
}

type NotificationNotFound {
  message: String!
}

type NotificationPage {
  items: [Notification!]!
  nextCursor: String
}

type PendingQuestionCreated {
  pendingCaptureId: ID!
  question: String!
}

type ProviderTimeout {
  message: String!
  budgetSeconds: Float!
}

type ProviderUnavailable {
  message: String!
}

type Query {
  captureHistory(cursor: String = null, limit: Int = null): CaptureHistoryPage!
  records(filter: RecordsFilterInput = null): [RecordItem!]!
  record(id: ID!): RecordResult!
  tasks: [Task!]!
  settings(detectedTimezone: String = null): Settings!
  me: Me!
  reminders(search: String = null): ReminderGroups!
  reminder(id: ID!): ReminderResult!
  notifications(cursor: String = null): NotificationPage!
  unreadNotificationCount: Int!
  memories(filter: MemoriesFilterInput = null): [Memory!]!
  memory(id: ID!): MemoryResult!
  apiVersion: String!
}

union RecordItem = Task | Reminder | Memory

type RecordNotFound {
  message: String!
}

union RecordResult = Task | RecordNotFound

input RecordsFilterInput {
  kind: String = null
  search: String = null
  sortBy: SortField! = CREATED_AT
  sortDesc: Boolean! = false
}

type Reminder {
  id: ID!
  description: String!
  state: ReminderState!
  nextFireAt: DateTime
  whenText: String!
  repeatText: String!
  repeatKind: ReminderRepeatKind!
  repeatInterval: Int!
  repeatWeekdays: [Int!]!
  repeatMonthDay: Int
  localTime: String!
  anchorLocalDate: Date!
  scheduleTimezone: String!
  lastFiredAt: DateTime
  lastAction: ReminderAction
  origin: String!
  originalInput: String
  createdAt: DateTime!
  updatedAt: DateTime!
  snoozedUntil: DateTime

  """Why the time differs from what was typed. Only on create."""
  whenNote: String
}

enum ReminderAction {
  DONE
  SNOOZED
  MISSED
}

union ReminderActionResult = Reminder | ReminderNotFound

type ReminderCreated {
  reminder: Reminder!
}

type ReminderDeleteSucceeded {
  id: ID!
}

type ReminderDeleted {
  message: String!
}

type ReminderGroups {
  needsAttention: [Reminder!]!
  upcoming: [Reminder!]!
  done: [Reminder!]!
}

type ReminderLimitReached {
  message: String!
  limit: Int!
}

type ReminderNotFound {
  message: String!
}

enum ReminderRepeatKind {
  NONE
  DAILY
  WEEKLY
  MONTHLY
  YEARLY
}

union ReminderResult = Reminder | ReminderNotFound

type ReminderSettingsSaved {
  settings: Settings!
  showBothOffWarning: Boolean!
}

enum ReminderState {
  UPCOMING
  FIRED
  DONE
}

type ReminderTimePassed {
  message: String!
}

type RemindersListed {
  reminders: [Reminder!]!
}

enum SecretKind {
  CARD
  ID_NUMBER
  TAX_ID
  CREDENTIAL
}

type Settings {
  timezone: String!
  updatedAt: DateTime!
  defaultReminderTime: String!
  popupsEnabled: Boolean!
  emailEnabled: Boolean!
}

type SharedQuotaExhausted {
  message: String!
}

input SignInInput {
  email: String!
  password: String!
}

union SignInResult = SignedIn | InvalidCredentials | AccountLocked | AccountNotVerified | AuthProviderUnavailable

type SignedIn {
  accessToken: String!
  refreshToken: String!
  expiresIn: Int!
}

enum SnoozeChoice {
  TEN_MINUTES
  ONE_HOUR
  TOMORROW
}

enum SortField {
  CREATED_AT
  DUE_AT
}

type Subscription {
  notificationReceived: Notification!
}

type Task {
  id: ID!
  title: String!
  dueAt: DateTime
  status: String!
  isOverdue: Boolean!
  origin: String!
  originalInput: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type TaskCreated {
  task: Task!
}

enum TaskStatus {
  PENDING
  DONE
}

type TasksListed {
  tasks: [Task!]!
}

type UnrecognisedCommand {
  attemptedName: String!
  closestMatches: [String!]!
}

input UpdateMemoryInput {
  text: String!
  category: MemoryCategory
}

union UpdateMemoryResult = Memory | MemoryTooLong | InvalidMemory | MemoryNotFound

input UpdateReminderInput {
  description: String!
  startDate: Date!
  localTime: String!
  repeatKind: ReminderRepeatKind!
  repeatInterval: Int! = 1
  repeatWeekdays: [Int!]! = []
}

union UpdateReminderResult = Reminder | InvalidReminder | ReminderTimePassed | ReminderDeleted | ReminderNotFound

input UpdateReminderSettingsInput {
  defaultReminderTime: String = null
  popupsEnabled: Boolean = null
  emailEnabled: Boolean = null
}

union UpdateReminderSettingsResult = ReminderSettingsSaved | InvalidReminderSettings

input UpdateTaskInput {
  title: String = null
  status: TaskStatus = null
  dueAt: DateTime
}

union UpdateTaskResult = Task | NoFieldsToUpdate | RecordNotFound

input UpdateTimezoneInput {
  timezone: String!
}

union UpdateTimezoneResult = Settings | InvalidTimezone

type UserLimitReached {
  message: String!
  limit: Int!
  resetsAt: DateTime!
}
