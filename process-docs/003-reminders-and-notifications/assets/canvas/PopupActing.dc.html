<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap">
<style>

:root{
  --paper:#faf8f4; --surface:#ffffff; --ink:#2f2823; --ink2:#6b625a; --ink3:#9c9389;
  --line:#e7e0d5; --line2:#d6ccbc; --rail:#f5f1ea;
  --blue:#2f5ea8; --blueWash:#eef3fb; --amber:#8a5a2b; --amberWash:#f8f1e6;
  --red:#a83f36; --redWash:#fbf0ee; --green:#2f7a52; --greenWash:#edf6f1;
}
*{box-sizing:border-box}
body{margin:0;width:1440px;height:900px;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-wrap:pretty}
a{color:#2f5ea8;text-decoration:none} a:hover{color:#24487f}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.app{display:flex;height:900px}
.rail{width:236px;flex-shrink:0;background:var(--rail);border-right:1px solid var(--line);
  padding:26px 16px 20px;display:flex;flex-direction:column;gap:26px}
.wordmark{font-family:'Instrument Serif',Georgia,serif;font-size:26px;letter-spacing:.01em;padding:0 10px;color:var(--ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.navitem{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:7px;
  color:var(--ink2);font-weight:500}
.navitem.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 rgba(47,40,35,.04),0 0 0 1px var(--line)}
.navitem svg{flex-shrink:0}
.railfoot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--amberWash);color:var(--amber);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;padding:0 28px;background:var(--paper)}
.h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2)}
.dim{color:var(--ink3)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px}
.col{width:100%;max-width:760px;margin:0 auto}
.stream{flex:1;overflow:hidden;padding:32px 40px 8px;display:flex;flex-direction:column;gap:20px}
.dock{flex-shrink:0;padding:14px 40px 26px;position:relative}
.inputwrap{position:relative;max-width:760px;margin:0 auto}
.input{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;background:var(--surface);
  border:1px solid var(--line2);border-radius:11px;box-shadow:0 1px 2px rgba(47,40,35,.05)}
.input.focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blueWash)}
.slash{width:26px;height:26px;border-radius:6px;background:var(--amberWash);color:var(--amber);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;flex-shrink:0}
.caret{display:inline-block;width:1.5px;height:18px;background:var(--blue);vertical-align:-3px;margin-left:1px}
.hint{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:12px;color:var(--ink3)}
.kbd{font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;color:var(--ink2);background:var(--surface)}
.palette{position:absolute;left:0;right:0;bottom:70px;background:var(--surface);border:1px solid var(--line2);
  border-radius:11px;box-shadow:0 12px 32px rgba(47,40,35,.13),0 2px 6px rgba(47,40,35,.06);overflow:hidden}
.paletop{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.cmd{display:flex;align-items:center;gap:14px;padding:11px 14px;border-bottom:1px solid #f2ece2}
.cmd:last-child{border-bottom:0}
.cmd.on{background:var(--blueWash)}
.cmdname{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:500;width:158px;flex-shrink:0}
.palefoot{display:flex;gap:16px;padding:9px 14px;background:#fbf8f3;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
.turn{display:flex;flex-direction:column;gap:10px}
.said{display:flex;justify-content:flex-end}
.saidbox{background:var(--surface);border:1px solid var(--line);border-radius:10px 10px 3px 10px;
  padding:10px 14px;font-family:'IBM Plex Mono',monospace;font-size:13.5px;max-width:560px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.cardhead{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line)}
.fields{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:1px;background:var(--line)}
.field{background:var(--surface);padding:13px 16px;display:flex;flex-direction:column;gap:3px}
.fval{font-size:14.5px;font-weight:500}
.cardfoot{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
  border-top:1px solid var(--line);background:#fcfaf6;font-size:12px;color:var(--ink3)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:8px;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:500;
  font-family:inherit;cursor:default}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.dan{background:var(--red);border-color:var(--red);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;height:23px;padding:0 9px;border-radius:20px;
  font-size:11.5px;font-weight:500;border:1px solid transparent}
.pill.pend{background:var(--amberWash);color:var(--amber);border-color:#ecdcc6}
.pill.done{background:var(--greenWash);color:var(--green);border-color:#d3e7dd}
.pill.wait{background:var(--blueWash);color:var(--blue);border-color:#d7e2f3}
.pill.err{background:var(--redWash);color:var(--red);border-color:#f0d7d3}
.note{display:flex;gap:11px;padding:14px 16px;border-radius:10px;border:1px solid}
.note.info{background:var(--blueWash);border-color:#d7e2f3}
.note.warn{background:var(--amberWash);border-color:#ecdcc6}
.note.err{background:var(--redWash);border-color:#f0d7d3}
.tabs{display:flex;gap:6px}
.tab{height:32px;padding:0 13px;border-radius:7px;display:flex;align-items:center;font-size:13px;
  font-weight:500;color:var(--ink2);border:1px solid transparent}
.tab.on{background:var(--surface);color:var(--ink);border-color:var(--line2)}
.search{display:flex;align-items:center;gap:9px;height:36px;width:280px;padding:0 12px;background:var(--surface);
  border:1px solid var(--line2);border-radius:8px;font-size:13.5px;color:var(--ink3)}
.tbl{width:100%;border-collapse:collapse;background:var(--surface)}
.tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);padding:11px 16px;border-bottom:1px solid var(--line2);background:#fbf8f3}
.tbl td{padding:0 16px;height:52px;border-bottom:1px solid #f2ece2;font-size:14px;vertical-align:middle}
.tbl tr.hov td{background:#fbf8f3}
.typetag{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2)}
.dot{width:7px;height:7px;border-radius:2px;background:var(--amber);flex-shrink:0}
.skel{background:linear-gradient(90deg,#efe9de 25%,#f6f1e9 37%,#efe9de 63%);background-size:400% 100%;
  animation:sh 1.4s ease infinite;border-radius:5px;height:11px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.pane{padding:28px 40px;overflow:hidden}
.modalbg{position:absolute;inset:0;background:rgba(47,40,35,.34)}
.modal{position:absolute;top:270px;left:50%;transform:translateX(-50%);width:460px;background:var(--surface);
  border-radius:13px;box-shadow:0 24px 60px rgba(47,40,35,.28);overflow:hidden}
.formrow{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.control{height:42px;display:flex;align-items:center;padding:0 13px;background:var(--surface);
  border:1px solid var(--line2);border-radius:8px;font-size:14px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;width:fit-content}
.seg div{height:40px;display:flex;align-items:center;padding:0 16px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.seg div.on{background:var(--blue);color:#fff}

.bell{position:relative;background:none;padding:0;font:inherit;width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink2);border:1px solid transparent}
.bell.on{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.badge{position:absolute;top:2px;right:1px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper);line-height:1}
.pill.late{background:var(--amberWash);color:var(--amber);border-color:#ecdcc6}
.pill.miss{background:var(--redWash);color:var(--red);border-color:#f0d7d3}
.pill.rep{background:var(--blueWash);color:var(--blue);border-color:#d7e2f3}
.dot.rem{background:var(--blue);border-radius:50%}
.grouphead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fbf8f3;border-bottom:1px solid var(--line2);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.grouphead .n{font-family:'IBM Plex Mono',monospace;letter-spacing:0;text-transform:none;font-weight:500}
.scrim{position:absolute;inset:0;background:rgba(47,40,35,.18)}
.panel{position:absolute;top:0;right:0;width:430px;height:900px;background:var(--surface);border-left:1px solid var(--line2);box-shadow:-18px 0 44px rgba(47,40,35,.14);display:flex;flex-direction:column}
.panelhead{height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 22px;border-bottom:1px solid var(--line)}
.panelfoot{margin-top:auto;padding:12px 22px;border-top:1px solid var(--line);background:#fcfaf6;font-size:12px;color:var(--ink3)}
.nitem{display:flex;gap:12px;padding:15px 22px;border-bottom:1px solid #f2ece2;position:relative}
.nitem.unread{background:#fdfbf7}
.nitem .udot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:7px;flex-shrink:0}
.nitem .rdot{width:8px;height:8px;flex-shrink:0}
.ntitle{font-weight:500;font-size:14px}
.nmeta{font-size:12.5px;color:var(--ink3);margin-top:2px}
.nacts{display:flex;gap:7px;margin-top:10px}
.toast{position:absolute;right:28px;width:392px;background:var(--surface);border:1px solid var(--line2);border-radius:13px;box-shadow:0 18px 44px rgba(47,40,35,.18),0 2px 6px rgba(47,40,35,.07);padding:15px 16px 14px}
.toasthead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3);margin-bottom:7px}
.toasttitle{font-size:16px;font-weight:600;letter-spacing:-.01em}
.x{margin-left:auto;color:var(--ink3);display:flex}
.menu{position:absolute;background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 32px rgba(47,40,35,.16);width:230px;overflow:hidden}
.menu div{padding:10px 14px;font-size:13.5px;display:flex;justify-content:space-between;border-bottom:1px solid #f2ece2}
.menu div:last-child{border-bottom:0}.menu div.on{background:var(--blueWash)}
.switch{width:40px;height:23px;border-radius:12px;background:var(--line2);position:relative;flex-shrink:0}
.switch:after{content:'';position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--blue)}.switch.on:after{left:19.5px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 20px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.sechead{font-size:15px;font-weight:600;margin:0 0 4px}
.chips{display:flex;gap:6px}
.chip{height:34px;min-width:38px;padding:0 11px;border-radius:8px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--ink2);background:var(--surface)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dtitle{font-family:'Instrument Serif',Georgia,serif;font-size:34px;line-height:1.15;margin:6px 0 10px}
.crumb{font-size:13px;color:var(--ink3)}

.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:rot .8s linear infinite;flex-shrink:0}
.spin.dk{border-color:var(--line2);border-top-color:var(--ink2)}
@keyframes rot{to{transform:rotate(360deg)}}
.btn.busy{opacity:.88}
.control.off{background:#f6f2eb;color:var(--ink3)}
.snack{position:absolute;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);border-radius:11px;padding:11px 12px 11px 14px;font-size:14px;box-shadow:0 14px 36px rgba(47,40,35,.28);transform:translateX(-50%);white-space:nowrap}
.snack .ok{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.snack a{color:#b9cff2;font-weight:500}
.snack .sx{color:var(--ink3);display:flex;margin-left:4px}
.skrow td{height:52px}

body{width:1440px;height:900px;position:relative}
</style>
