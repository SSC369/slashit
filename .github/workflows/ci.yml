name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy app

      - name: Tests
        # Unit tests only: they run against fakes, per repo-rules.md §15. The
        # integration suite needs a real Supabase-shaped Postgres database,
        # which CI does not yet provision. Tracked as D-11 in the AI Gateway
        # dev log rather than solved here with a placeholder database.
        run: pytest tests/unit tests/test_settings.py tests/test_logging_redaction.py
        env:
          GEMINI_API_KEY: "ci-placeholder-not-a-real-key"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          SUPABASE_URL: "https://ci-placeholder.supabase.co"
          SUPABASE_JWKS_URL: "https://ci-placeholder.supabase.co/auth/v1/.well-known/jwks.json"
          # Required by Settings since 002's b7efa24; the Format step's failure
          # hid its absence until now. Not a secret (app/core/settings.py).
          SUPABASE_PUBLISHABLE_KEY: "ci-placeholder-publishable-key"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Requirement NFR-1: the credential does not appear outside the server
      # environment. Zero occurrences is the only acceptable number, so this
      # job scans full history rather than the diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
